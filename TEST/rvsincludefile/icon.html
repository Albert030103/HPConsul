<script type="text/javascript">
var SubjectLine='Check out the '+top.document.title+'';
var BodyText='I thought you might be interested in the '+top.document.title+' You can view it at '+top.location.href+'';
var Message = '<a class="contact" href="mailto:?SUBJECT='+SubjectLine+'&BODY='+BodyText+'">'+'<input type="image" src="../images/pfbe.gif" title="Email a Page to a Friend" alt="Email a Page to a Friend"></a>';
var MessageIE = '<a href="mailto:?SUBJECT='+SubjectLine+'&BODY='+BodyText+'">'+'        <img src="../images/pfbe.gif" title="Email a Page to a Friend" alt="Email a Page to a Friend" width="22" height="22"  hspace="4" style="cursor:pointer" border="0">        '+'</a>';
if(document.all)
	{ document.write(MessageIE); }
else { document.write(Message); };
</script>
</td>

<input type="image" src="../images/afbe.gif" width="22" height="22"  hspace="4" title="Add to Favorite" alt="Add to Favorite"onclick="

                 window.sidebar.addPanel(document.title,location.href,'');
