<html xmlns="http://www.w3.org/1999/xhtml">
<head>

<meta http-equiv="content-type" content="{%MetaCharset%}" />
<meta name="description" content="{%MetaDescription%}" />
<meta name="keywords" content="{%MetaKeywords%}" />
<title>{%MetaTitle%}</title>

<link href="images/default.css" rel="stylesheet" type="text/css" media="screen" />
</head>
<body>
<!-- start header -->
<div id="header">
<h1>{%WebsiteName%}</h1>
<p>{%WebsiteSlogan%}</p>
</div>
<!-- end header --><!-- start page -->
<div id="page"><!-- start content -->
<div id="content">
<div class="post">
<h1 class="title">{%name%}</h1>
<div class="entry">
<p>{%content%}</p>
</div>
</div>
</div>
<!-- end content --><!-- start sidebar -->
<div id="sidebar">
<ul>
<li>
<h2>Menu</h2>
<ul>
{%menu_start=1%}
<li><a href="{%menu_href%}">{%menu_display%}</a></li>
{%menu_end=1%} 
</ul>
</li>
<li>
<h2>News</h2>
{%news%} </li>
</ul>
</div>
<!-- end sidebar --></div>
<!-- end page -->
<div id="footer">
<p>{%WebsiteFooter%}</p>
</div>
</body>
</html>
